[project]
name = "cosplaytele-mcp"
version = "0.3.1"
description = "MCP 2 server for CosplayTele and related gallery sites"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "XeroTeam" }]
dependencies = [
    "mcp[cli]>=2,<3",
    "httpx>=0.28",
    "pydantic>=2",
    "selectolax>=0.3",
]

[project.urls]
Homepage = "https://github.com/Xero-Team/cosplaytele-mcp"
Repository = "https://github.com/Xero-Team/cosplaytele-mcp"
Issues = "https://github.com/Xero-Team/cosplaytele-mcp/issues"

[project.scripts]
cosplaytele-mcp = "cosplaytele_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "inline-snapshot>=0.23",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/cosplaytele_mcp"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "PT",
    "C4",
]
ignore = [
    "E501",
    "B008",
    "RUF001",
]

[tool.ruff.lint.isort]
known-first-party = ["cosplaytele_mcp"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# These client boundary methods expose HTTPX's per-request timeout API.
"src/cosplaytele_mcp/http.py" = ["ASYNC109"]
"src/cosplaytele_mcp/wordpress.py" = ["ASYNC109"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
