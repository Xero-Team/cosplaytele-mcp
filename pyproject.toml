[project]
name = "cosplaytele-mcp"
version = "0.6.2"
description = "MCP 2 server for CosplayTele and related gallery sites"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "XeroTeam" }]
dependencies = [
    "mcp[cli]>=2.2,<3",
    "httpx>=0.28",
    "pydantic>=2",
    "selectolax>=1.0",
]

[project.urls]
Homepage = "https://github.com/Xero-Team/cosplaytele-mcp"
Repository = "https://github.com/Xero-Team/cosplaytele-mcp"
Issues = "https://github.com/Xero-Team/cosplaytele-mcp/issues"

[project.scripts]
cosplaytele-mcp = "cosplaytele_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "inline-snapshot>=0.23",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/cosplaytele_mcp"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "DTZ",
    "E",
    "F",
    "FURB",
    "G",
    "I",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "E501",
    "B008",
    "RUF001",
    # Literal HTTP status codes, page sizes, and fixture counts read better inline.
    "PLR2004",
    # Raises inside try blocks are converted to tool errors at the MCP boundary.
    "TRY301",
    # Exception messages carry the source-specific context that makes them actionable.
    "TRY003",
]

[tool.ruff.lint.pylint]
# The HTTP client and file helpers intentionally expose several keyword parameters.
max-args = 10

[tool.ruff.lint.isort]
known-first-party = ["cosplaytele_mcp"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# These client boundary methods expose HTTPX's per-request timeout API and raw JSON.
"src/cosplaytele_mcp/http.py" = ["ANN401", "ASYNC109"]
"src/cosplaytele_mcp/wordpress.py" = ["ASYNC109"]
# MCP evaluates tool and middleware annotations at runtime, so those imports stay live.
"src/cosplaytele_mcp/server.py" = ["PLR0915", "PLR0917", "TC001", "TC002", "TC003"]
# make_gallery exposes the full gallery schema in one keyword-only call.
"src/cosplaytele_mcp/sources/base.py" = ["PLR0913"]
# Source implementations match the shared protocol but may not need every argument.
"src/cosplaytele_mcp/sources/*.py" = ["ARG002"]
# Upstream API payloads are untyped JSON until each source validates them.
"src/cosplaytele_mcp/sources/simplycosplay.py" = ["ANN401"]
"tests/*.py" = ["S101", "S104", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
